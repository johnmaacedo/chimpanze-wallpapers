<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Identificar monitor</title>
  <style>@font-face{font-family:Unbounded;src:url(./fonts/unbounded.woff2)format("woff2");font-weight:200 900}html,body{background:0 0;height:100%;margin:0;font-family:Unbounded,Segoe UI,sans-serif;overflow:hidden}.frame{border:6px solid #ff8a3d;border-radius:4px;animation:3.4s cubic-bezier(.2,.8,.2,1) forwards frame;position:fixed;inset:0;box-shadow:inset 0 0 80px #ff8a3d59}.card{backdrop-filter:blur(18px);color:#fff4e8;background:#140d09c7;border:1px solid #ffbe8c40;border-radius:36px;flex-direction:column;align-items:center;gap:10px;padding:36px 64px 40px;animation:3.4s cubic-bezier(.2,.9,.2,1) forwards pop;display:flex;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);box-shadow:0 30px 80px #00000080}.num{background:linear-gradient(#ffd28a,#ff7a2f);color:#0000;background-clip:text;font-size:168px;font-weight:800;line-height:1}.name{letter-spacing:.01em;font-size:26px;font-weight:600}.meta{opacity:.72;font-family:Segoe UI,sans-serif;font-size:17px}.badge{color:#1a0f08;background:#ff8a3d;border-radius:99px;margin-top:6px;padding:4px 12px;font-family:Segoe UI,sans-serif;font-size:13px;font-weight:700}@keyframes pop{0%{opacity:0;transform:translate(-50%,-46%)scale(.86)}12%{opacity:1;transform:translate(-50%,-50%)scale(1)}85%{opacity:1;transform:translate(-50%,-50%)scale(1)}to{opacity:0;transform:translate(-50%,-52%)scale(.96)}}@keyframes frame{0%{opacity:0}10%{opacity:1}85%{opacity:1}to{opacity:0}}</style>
</head>
<body>
  <div class="frame"></div>
  <div class="card">
    <div class="num" id="n">1</div>
    <div class="name" id="name"></div>
    <div class="meta" id="meta"></div>
    <div class="badge" id="primary" hidden>Principal</div>
  </div>
  <script>
    const q = new URLSearchParams(location.search);
    document.getElementById('n').textContent = q.get('n') || '?';
    document.getElementById('name').textContent = q.get('name') || '';
    const hz = q.get('hz');
    document.getElementById('meta').textContent = (q.get('res') || '') + (hz && hz !== '0' ? ` · ${hz} Hz` : '');
    if (q.get('primary') === '1') document.getElementById('primary').hidden = false;
  </script>
</body>
</html>
